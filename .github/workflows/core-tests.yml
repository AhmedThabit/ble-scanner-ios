name: Core tests (Linux)

on:
  push:
    branches: [main]
    paths:
      - "BLECore/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "BLECore/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run unit tests
        run: swift test --package-path BLECore
